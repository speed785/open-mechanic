name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: Short summary of the bug
      placeholder: e.g. Connection drops after 30 seconds on Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? What were you trying to do?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue
      placeholder: |
        1. Run `open-mechanic diagnose --vehicle "2018 Ford F-150"`
        2. Wait for connection...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: e.g. 3.11.8
    validations:
      required: true

  - type: input
    id: obd_adapter
    attributes:
      label: OBD Adapter
      description: Which OBD-II adapter are you using?
      placeholder: OBDLink EX
    validations:
      required: false

  - type: textarea
    id: error_output
    attributes:
      label: Error Output
      description: Paste the full error traceback or terminal output
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Anything else that might be relevant (vehicle make/model, port used, etc.)
    validations:
      required: false
