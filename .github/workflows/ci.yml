# Status checks used for branch protection: lint, typecheck, test
# All three jobs must pass before merging to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-${{ matrix.python-version }}-

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        # Gracefully skip if src/ or scripts/ don't exist yet (pre-Phase 1)
        run: |
          TARGETS=""
          [ -d "src" ] && TARGETS="$TARGETS src/"
          [ -d "scripts" ] && TARGETS="$TARGETS scripts/"
          if [ -n "$TARGETS" ]; then ruff check $TARGETS; else echo "No source directories yet — skipping lint"; fi

      - name: Run ruff format check
        run: |
          TARGETS=""
          [ -d "src" ] && TARGETS="$TARGETS src/"
          [ -d "scripts" ] && TARGETS="$TARGETS scripts/"
          if [ -n "$TARGETS" ]; then ruff format --check $TARGETS; else echo "No source directories yet — skipping format check"; fi

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-${{ matrix.python-version }}-

      - name: Install package with dev and API dependencies
        run: pip install -e ".[dev,api]"

      - name: Run mypy
        run: |
          if [ -d "src" ]; then mypy src/; else echo "src/ not yet created — skipping typecheck"; fi

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-

      - name: Install package with dev dependencies
        run: |
          if [ -f "pyproject.toml" ]; then pip install -e ".[dev]"; else pip install pytest; fi

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  website:
    name: Website (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Run website build
        working-directory: website
        run: npm run build
