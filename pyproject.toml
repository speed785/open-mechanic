[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-mechanic"
version = "0.1.0"
description = "Open-source AI-powered car diagnostics via OBD-II and Claude API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "open-mechanic contributors" }]
keywords = ["obd2", "car-diagnostics", "automotive", "claude-ai", "obdlink"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "obd>=0.7.1",
    "pyserial>=3.5",
    "anthropic>=0.20.0",
    "sqlalchemy>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
]

[project.scripts]
open-mechanic = "open_mechanic.__main__:main"

[project.urls]
Homepage = "https://github.com/speed785/open-mechanic"
Repository = "https://github.com/speed785/open-mechanic"
Issues = "https://github.com/speed785/open-mechanic/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/open_mechanic"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=open_mechanic --cov-report=term-missing --cov-fail-under=100"
